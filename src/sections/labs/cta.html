<section class="labs-final-cta" aria-labelledby="labs-cta-heading">
  <div class="container">
    <div class="labs-cta-box rv">

      <!-- Ambient glow layers (decorative) -->

        <p class="labs-cta-desc">

        <div class="labs-cta-actions">
