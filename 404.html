<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Kritexa Labs</title>
<meta name="description" content="The page you were looking for could not be found. Return to Kritexa Labs.">
<link rel="canonical" href="https://www.kritexalabs.com/404">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css">
<link rel="stylesheet" href="/css/utilities.css">
<link rel="stylesheet" href="/css/components.css">
<style>
.error-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  text-align:center;position:relative;z-index:2;
  padding:40px 24px;
}
.error-code{
  font-size:clamp(80px,15vw,160px);font-weight:900;
  letter-spacing:-0.04em;line-height:1;
  background:linear-gradient(135deg,#fff 0%,#9D6FFF 50%,#06B6D4 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:16px;
}
.error-mono{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:#9D6FFF;margin-bottom:24px;
}
.error-title{
  font-size:clamp(24px,4vw,36px);font-weight:700;
  letter-spacing:-0.5px;margin-bottom:16px;
}
.error-desc{
  font-size:16px;color:#A1A1AA;max-width:420px;margin:0 auto 40px;line-height:1.65;
}
.error-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
</style>
</head>
<body>

<!-- Cursor dots (global) -->
<div id="cur"></div><div id="cur-r"></div>
<!-- Ambient background -->
<div class="ambient">
  <div class="amb-blob ab1"></div>
  <div class="amb-blob ab2"></div>
  <div class="amb-blob ab3"></div>
</div>

<div class="error-page">
  <div>
    <div class="error-code">404</div>
    <div class="error-mono">Page Not Found</div>
    <h1 class="error-title">This page doesn't exist</h1>
    <p class="error-desc">The page you were looking for has moved, been deleted, or never existed. Let's get you back on track.</p>
    <div class="error-btns">
      <a href="/" class="btn-p">← Go Home</a>
      <a href="/contact" class="btn-g">Contact Us</a>
    </div>
  </div>
</div>

<script src="/js/global.js"></script>
</body>
</html>
